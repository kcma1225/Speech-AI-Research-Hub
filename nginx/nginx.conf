user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # 10 login/join attempts per minute per client, as in v1; generous general API limit.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    # Live username check on the join form (needs a valid invitation token): typing-friendly but bounded.
    limit_req_zone $binary_remote_addr zone=join_check_limit:1m rate=30r/m;
    # OIDC token endpoint (Aldine's server, one IP for every lab sign-in): bounded but not login-strict.
    limit_req_zone $binary_remote_addr zone=oidc_limit:1m rate=60r/m;
    limit_req_status 429;

    # Docker DNS. `resolve` re-resolves the backend so a recreated container (new IP) is picked up
    # without restarting nginx (open-source nginx >= 1.27.3).
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream backend {
        zone backend 64k;
        server backend:3000 resolve;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}
