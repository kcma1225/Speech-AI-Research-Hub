# http-level maps for the Aldine proxy (included only when LaTeX is enabled).
map $http_upgrade $latex_connection_upgrade {
    default upgrade;
    ''      close;
}
# The Cookie header minus hub_session.
map $http_cookie $latex_cookie {
    default $http_cookie;
    "~^(?<latex_pre>.*?)(?:^|;[ ]*)hub_session=[^;]*(?<latex_post>.*)$" "$latex_pre$latex_post";
}
