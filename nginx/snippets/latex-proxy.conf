# Proxy settings for Aldine (LATEX_HOSTNAME or LATEX_PATH). Live collaboration runs over the /collab WebSocket.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $latex_connection_upgrade;
# Never hand the hub session to Aldine (matters in LATEX_PATH mode, where the browser sends it).
proxy_set_header Cookie $latex_cookie;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
