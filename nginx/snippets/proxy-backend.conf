# Shared proxy settings for /api. X-Forwarded-For is overwritten (not appended) so clients cannot spoof
# the IP the backend sees. Behind a reverse proxy, TRUSTED_PROXIES makes $remote_addr the real client IP.
proxy_pass http://backend;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header Origin $http_origin;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
# Uploads stream straight to the backend (and on to object storage) instead of spooling to nginx disk.
client_max_body_size 1g;
proxy_request_buffering off;
proxy_connect_timeout 10s;
proxy_send_timeout 600s;
proxy_read_timeout 600s;
