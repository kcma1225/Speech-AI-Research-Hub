# Server-Sent Events (AI streaming: /api/ai/, /api/agent/, note AI actions). Same forwarding as proxy-backend.conf
# (kept standalone: nginx rejects a directive set twice in one location), plus no buffering so tokens reach the
# browser as they arrive (the backend also sends X-Accel-Buffering: no) and a long read timeout for slow models.
proxy_pass http://backend;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header Origin $http_origin;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
client_max_body_size 1g;
proxy_request_buffering off;
proxy_buffering off;
proxy_cache off;
proxy_connect_timeout 10s;
proxy_send_timeout 600s;
proxy_read_timeout 900s;
gzip off;
