# Headers for the SPA shell and its static assets. /api responses carry their own headers (the slide
# viewer sets a sandbox CSP), so this snippet is only included in static locations.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' ${SCRIPT_HASHES}; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=()" always;
${HSTS_HEADER}
