services:
  nginx:
    build: ./nginx
    ports:
      - "${APP_HTTP_PORT:-80}:80"
      - "${APP_HTTPS_PORT:-443}:443"
    environment:
      HTTPS_ENABLED: ${HTTPS_ENABLED:-false}
      APP_HOSTNAME: ${APP_HOSTNAME:-localhost}
      OVERLEAF_HOSTNAME: ${OVERLEAF_HOSTNAME:-overleaf.localhost}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost}
    depends_on:
      app:
        condition: service_healthy
      overleaf:
        condition: service_healthy
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped

  app:
    build: ./app
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Speech-AI Research Hub}
      DATABASE_HOST: ${DATABASE_HOST:-db}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: ${DATABASE_NAME:-research_hub}
      DATABASE_USER: ${DATABASE_USER:-research_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Set OWNER_PASSWORD in .env}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      SLIDES_DIR: ${SLIDES_DIR:-/data/slides}
      OWNER_NAME: ${OWNER_NAME:-Owner}
      OVERLEAF_URL: ${OVERLEAF_URL:-http://overleaf.localhost/}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
    volumes:
      - uploads:/data/uploads
      - slide_projects:/data/slides
    entrypoint:
      - sh
      - -c
      - |
        chown nextjs:nodejs /data/uploads /data/slides
        mkdir -p /data/slides/jobs /data/slides/projects
        chown nextjs:nodejs /data/slides/jobs /data/slides/projects
        exec su-exec nextjs:nodejs node server.js
    user: root
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  slide-renderer:
    build: ./slide-renderer
    platform: linux/amd64
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    tmpfs: ["/tmp:size=512m,mode=1777"]
    volumes:
      - slide_projects:/data/slides
    restart: unless-stopped

  overleaf:
    image: sharelatex/sharelatex:latest
    platform: linux/amd64
    environment:
      OVERLEAF_APP_NAME: Speech-AI Research Hub Overleaf
      OVERLEAF_MONGO_URL: >-
        mongodb://overleaf-mongo/sharelatex?replicaSet=overleaf
      OVERLEAF_REDIS_HOST: overleaf-redis
      REDIS_HOST: overleaf-redis
      OVERLEAF_SITE_URL: ${OVERLEAF_SITE_URL:-http://overleaf.localhost}
      OVERLEAF_BEHIND_PROXY: "true"
      OVERLEAF_SECURE_COOKIE: ${OVERLEAF_SECURE_COOKIE:-false}
      OVERLEAF_TRUST_PROXY: "true"
      OVERLEAF_INVITE_TOKEN_SECRET: >-
        ${OVERLEAF_INVITE_SECRET:?Set OVERLEAF_INVITE_SECRET in .env}
      ENABLED_LINKED_FILE_TYPES: project_file,project_output_file
      ENABLE_CONVERSIONS: "true"
      EMAIL_CONFIRMATION_DISABLED: "true"
    depends_on:
      overleaf-mongo-init:
        condition: service_completed_successfully
      overleaf-redis:
        condition: service_healthy
    # Overleaf treats even OVERLEAF_SECURE_COOKIE=false as true when present.
    # Remove it entirely on HTTP; keep it present only when HTTPS is enabled.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ "$$OVERLEAF_SECURE_COOKIE" != true ]; then
          unset OVERLEAF_SECURE_COOKIE
        fi
        exec /sbin/my_init
    volumes:
      - overleaf_data:/var/lib/overleaf
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/status"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 180s
    stop_grace_period: 60s
    restart: unless-stopped

  overleaf-mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "overleaf", "--bind_ip_all"]
    environment:
      MONGO_INITDB_DATABASE: sharelatex
    volumes:
      - overleaf_mongo_data:/data/db
    # Replica set is initiated by overleaf-mongo-init.
    # An initdb script cannot do this:
    # it: the entrypoint's temporary mongod binds 127.0.0.1 only, so
    # rs.initiate with host overleaf-mongo:27017 fails and mongod exits.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  overleaf-mongo-init:
    image: mongo:8.0
    command: ["/bin/sh", "/mongo-init.sh"]
    depends_on:
      overleaf-mongo:
        condition: service_healthy
    volumes:
      - ./overleaf/mongo-init.sh:/mongo-init.sh:ro
    restart: "no"

  overleaf-redis:
    image: redis:6.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - overleaf_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "/usr/local/bin/reconcile-password.sh"]
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-research_hub}
      POSTGRES_USER: ${DATABASE_USER:-research_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-entrypoint.sh:/usr/local/bin/reconcile-password.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1
          -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
          -Atqc 'SELECT 1' | grep -qx 1
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
  slide_projects:
  overleaf_data:
  overleaf_mongo_data:
  overleaf_redis_data:
