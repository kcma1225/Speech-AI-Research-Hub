# Speech-AI Research Hub v3. See docs/architecture.md.
# Only nginx publishes ports; everything else is reachable solely on internal networks.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  nginx:
    build:
      context: ./nginx
      additional_contexts:
        frontend: ./frontend
    ports:
      - "${APP_HTTP_PORT:-80}:80"
      - "${APP_HTTPS_PORT:-443}:443"
    environment:
      HTTPS_ENABLED: ${HTTPS_ENABLED:-false}
      APP_HOSTNAME: ${APP_HOSTNAME:-localhost}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    networks: [edge]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-research_hub}
      DATABASE_USER: ${DATABASE_USER:-research_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # Initial admin; the backend falls back to the legacy OWNER_* values and refuses to start without a password.
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      OWNER_NAME: ${OWNER_NAME:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      # AES-256-GCM key for provider secrets stored in the DB (AI platform); never shared with AUTH_SECRET.
      PROVIDER_TOKEN_KEY: ${PROVIDER_TOKEN_KEY:-}
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: ${S3_BUCKET:-hub}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      # OIDC provider (issuer <APP_ORIGIN>/api/oidc, kept for future MCP OAuth); off unless all three are set.
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URIS: ${OIDC_REDIRECT_URIS:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Speech-AI Research Hub}
    read_only: true
    tmpfs: ["/tmp:size=1g,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [edge, internal]
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *logging

  # AI background jobs (ai_* kinds: transcription, meeting analysis, embeddings, slide generation, library imports).
  # Same image as the backend; needs internet for cloud model/ASR providers and paper sources.
  ai-worker:
    build: ./backend
    command: ["node", "dist/ai-worker/main.js"]
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-research_hub}
      DATABASE_USER: ${DATABASE_USER:-research_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # Initial admin; the backend falls back to the legacy OWNER_* values and refuses to start without a password.
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      OWNER_NAME: ${OWNER_NAME:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      PROVIDER_TOKEN_KEY: ${PROVIDER_TOKEN_KEY:-}
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: ${S3_BUCKET:-hub}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      AI_WORKER_CONCURRENCY: ${AI_WORKER_CONCURRENCY:-2}
    init: true # reaps orphaned ffmpeg / pdftoppm / CLI children
    read_only: true
    tmpfs: ["/tmp:size=4g,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [edge, internal]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      disable: true
    stop_grace_period: 45s
    restart: unless-stopped
    logging: *logging

  # Renders slides (Quarto + headless Chrome) and transcodes media (ffmpeg) from untrusted uploads.
  # It can reach only db and rustfs ("jobs" network has no internet) and connects as hub_worker,
  # which may only read/update the jobs table.
  worker:
    build: ./worker
    platform: linux/amd64
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-research_hub}
      WORKER_DB_USER: hub_worker
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?Set WORKER_DB_PASSWORD in .env}
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: ${S3_BUCKET:-hub}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
    # tini as PID 1 reaps orphaned Chrome / LibreOffice / gpg children: node does not, and the zombies used up
    # pids_limit until Chrome could no longer start (renders failed with "Navigation timeout" / "Network.enable timed out").
    init: true
    read_only: true
    tmpfs: ["/tmp:size=2g,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    networks: [jobs]
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      # Migrations (jobs table, hub_worker grants) run at backend start.
      backend:
        condition: service_healthy
    stop_grace_period: 60s
    restart: unless-stopped
    logging: *logging

  # Compiles LaTeX projects (`latex_compile` jobs only; latex-runner/README.md). TeX Live + Noto CJK, every compile in a
  # bubblewrap sandbox (no network, only its own project dir). Like the worker it reaches only db + rustfs ("jobs"
  # network, no internet) as hub_worker. Custom seccomp = Docker's default + namespace/mount syscalls for bwrap.
  latex-runner:
    build: ./latex-runner
    image: hub-latex-runner:${HUB_VERSION:-dev}
    platform: linux/amd64
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-research_hub}
      WORKER_DB_USER: hub_worker
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?Set WORKER_DB_PASSWORD in .env}
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: ${S3_BUCKET:-hub}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      LATEX_CONCURRENCY: ${LATEX_CONCURRENCY:-2}
      LATEX_TIMEOUT_SECONDS: ${LATEX_TIMEOUT_SECONDS:-120}
      # Per-compile project directories live below the cache volume (the root fs is read-only).
      WORK_DIR: /var/latex/work
    volumes:
      - latex_cache:/var/latex # per-project build caches only; safe to delete
    tmpfs: ["/tmp:size=512m,mode=1777"]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./latex-runner/seccomp.json
    mem_limit: 5g # 2 slots × 2 GiB RLIMIT_AS + runner
    pids_limit: 512
    networks: [jobs]
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      # Migrations (jobs table, hub_worker grants) run at backend start.
      backend:
        condition: service_healthy
    stop_grace_period: 60s
    restart: unless-stopped
    logging: *logging

  db:
    # PostgreSQL 17 + pgvector (semantic search); pg_trgm ships with it. Extensions are created by migration 0001.
    image: pgvector/pgvector:0.8.7-pg17
    entrypoint: ["/bin/sh", "/hub/entrypoint.sh"]
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-research_hub}
      POSTGRES_USER: ${DATABASE_USER:-research_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?Set WORKER_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/entrypoint.sh:/hub/entrypoint.sh:ro
      - ./postgres/healthcheck.sh:/hub/healthcheck.sh:ro
    networks: [internal, jobs]
    healthcheck:
      test: ["CMD", "/bin/sh", "/hub/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    shm_size: 256m
    stop_grace_period: 60s
    restart: unless-stopped
    logging: *logging

  # S3-compatible object storage. Never published; the backend streams files to clients.
  rustfs:
    image: rustfs/rustfs:1.0.1
    command: ["rustfs"]
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    volumes:
      - rustfsdata:/data
    networks: [internal, jobs]
    # Any HTTP response means the API is up; anonymous requests get 403.
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:9000/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    logging: *logging

networks:
  edge: {}
  internal:
    internal: true
  jobs:
    internal: true

volumes:
  pgdata:
  rustfsdata:
  latex_cache:
