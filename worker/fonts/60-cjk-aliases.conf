<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Uploaded PDFs/PPTX often name Windows/macOS CJK fonts that are not installed (微軟正黑體, PingFang, 新細明體…).
  Without these aliases fontconfig falls back to Liberation Mono, which has no CJK glyphs, so poppler/LibreOffice draw
  missing-glyph boxes (e.g. for 「：」). Map them to Noto CJK, and give unknown families a CJK-capable fallback.
-->
<fontconfig>
  <alias binding="same"><family>Microsoft JhengHei</family><prefer><family>Noto Sans CJK TC</family></prefer></alias>
  <alias binding="same"><family>微軟正黑體</family><prefer><family>Noto Sans CJK TC</family></prefer></alias>
  <alias binding="same"><family>Microsoft JhengHei UI</family><prefer><family>Noto Sans CJK TC</family></prefer></alias>
  <alias binding="same"><family>Microsoft YaHei</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>微软雅黑</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>PingFang TC</family><prefer><family>Noto Sans CJK TC</family></prefer></alias>
  <alias binding="same"><family>PingFang SC</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>PingFang</family><prefer><family>Noto Sans CJK TC</family></prefer></alias>
  <alias binding="same"><family>Heiti TC</family><prefer><family>Noto Sans CJK TC</family></prefer></alias>
  <alias binding="same"><family>Hiragino Sans</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>SimHei</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>DFKai-SB</family><prefer><family>Noto Serif CJK TC</family></prefer></alias>
  <alias binding="same"><family>標楷體</family><prefer><family>Noto Serif CJK TC</family></prefer></alias>
  <alias binding="same"><family>PMingLiU</family><prefer><family>Noto Serif CJK TC</family></prefer></alias>
  <alias binding="same"><family>MingLiU</family><prefer><family>Noto Serif CJK TC</family></prefer></alias>
  <alias binding="same"><family>新細明體</family><prefer><family>Noto Serif CJK TC</family></prefer></alias>
  <alias binding="same"><family>細明體</family><prefer><family>Noto Serif CJK TC</family></prefer></alias>
  <alias binding="same"><family>SimSun</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>宋体</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>Songti TC</family><prefer><family>Noto Serif CJK TC</family></prefer></alias>
  <alias binding="same"><family>MS Gothic</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>MS Mincho</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
  <alias binding="same"><family>Malgun Gothic</family><prefer><family>Noto Sans CJK KR</family></prefer></alias>
  <!-- Generic families: Latin first (metric-compatible), then CJK, so mixed text never falls through to a box. -->
  <alias><family>sans-serif</family><prefer><family>Liberation Sans</family><family>Noto Sans CJK TC</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Liberation Serif</family><family>Noto Serif CJK TC</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Liberation Mono</family><family>Noto Sans Mono CJK TC</family></prefer></alias>
  <!-- Unknown family names fall back to sans-serif (not the first installed font). -->
  <match target="pattern">
    <test qual="all" name="family" compare="not_eq"><string>sans-serif</string></test>
    <test qual="all" name="family" compare="not_eq"><string>serif</string></test>
    <test qual="all" name="family" compare="not_eq"><string>monospace</string></test>
    <edit name="family" mode="append_last"><string>sans-serif</string></edit>
  </match>
</fontconfig>
